            --text-primary: #e0e0e0;
            --text-secondary: #888888;
            --accent-gold: #d4af37;

            --accent-blue: #3b82f6;
            --accent-orange: #f59e0b;
            --accent-red: #ff6b6b;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
        }

        .sim-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .sim-header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 2px solid var(--accent-gold);
            margin-bottom: 40px;
        }

        .sim-header h1 {
            font-size: 44px;
            color: #ffffff;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .sim-subtitle {
            font-size: 17px;
            color: var(--text-secondary);
        }

        /* Form Section */
        .sim-section {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .sim-form {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            align-items: flex-end;
        }

        .sim-form-group {
            display: flex;
            flex-direction: column;
        }

        .sim-form-group label {
            font-size: 14px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .sim-form-group input {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px;
            border-radius: 4px;
            font-size: 17px;
        }

        .sim-form-group input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        /* Form Error */
        .sim-form-error {
            grid-column: 1 / -1;
            background-color: rgba(255, 107, 107, 0.2);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Buttons */
        .sim-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .sim-btn-primary {
            background: linear-gradient(135deg, var(--accent-gold), #c99a1f);
            color: #000000;
        }

        .sim-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        /* Tabs */
        .sim-tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 30px;
            overflow-x: auto;
            gap: 0;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .sim-tabs::-webkit-scrollbar {
            height: 4px;
        }

        .sim-tabs::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .sim-tabs::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }

        .sim-tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 15px 20px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
        }

        .sim-tab-btn:hover {
            color: var(--text-primary);
        }

        .sim-tab-active {
            color: var(--accent-gold);
            border-bottom-color: var(--accent-gold);
        }

        /* Cards Grid */
        .sim-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .sim-card {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .sim-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-4px);
        }

        .sim-card-label {
            font-size: 14px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .sim-card-value {
            font-size: 34px;
            color: #ffffff;
            font-weight: bold;
            word-break: break-word;
        }

        .sim-card-detail {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        /* Random Comment */
        .sim-comentario {
            background: linear-gradient(135deg, rgba(45, 212, 164, 0.15), rgba(212, 175, 55, 0.1));
            border: 1px solid var(--accent-green);
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 25px;
            font-size: 15px;
            color: #2dd4a4;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.3px;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Chart Container */
        .sim-chart-container {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Table */
        .sim-table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .sim-table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--bg-tertiary);
        }

        .sim-table thead {
            background-color: var(--bg-tertiary);
            border-bottom: 2px solid var(--border-color);
        }

        .sim-table th {
            padding: 15px;
            text-align: right;
            font-size: 14px;
            text-transform: uppercase;
            color: var(--accent-gold);
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .sim-table th:first-child {
            text-align: left;
        }

        .sim-table td {
            padding: 12px 15px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 15px;
        }

        .sim-table td:first-child {
            text-align: left;
            color: var(--text-secondary);
        }

        .sim-table tbody tr:nth-child(odd) {
            background-color: #1a1a2e;
        }

        .sim-table tbody tr:nth-child(even) {
            background-color: #1f1f3a;
        }

        .sim-table tbody tr:hover {
            background-color: #252540;
        }

        /* Responsive Design */
        @media (max-width: 1199px) {
            .sim-form {
                grid-template-columns: repeat(2, 1fr);
            }

            .sim-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 767px) {
            .sim-header h1 {
                font-size: 24px;
            }

            .sim-form {
                grid-template-columns: 1fr;
            }

            .sim-cards {
                grid-template-columns: 1fr;
            }

            .sim-section {
                padding: 20px;
            }

            .sim-card-value {
                font-size: 24px;
            }

            .sim-chart-container {
                height: 300px;
            }

            .sim-table {
                font-size: 14px;
            }

            .sim-table th,
            .sim-table td {
                padding: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>

        // Simulation function for entire portfolio (with monthly stock purchases)
        function simularCarteira(meses, acoesPerMesInput) {
            const acoesPerMes = acoesPerMesInput || 0;
            const crescMensal = Math.pow(1.08, 1/12) - 1; // Convert 8% annual to monthly

            let resultados = [];
            let quantidadeAcoes = {};
            let saldoAnterior = 0;

            // Initialize quantities (1 share of each at start)
            empresas.forEach(e => {
                quantidadeAcoes[e.id] = e.quantidade;
                saldoAnterior += e.precoCom * e.quantidade;
            });

            for (let mes = 1; mes <= meses; mes++) {
                const mesAtual = mes;

                // Calculate price at end of month
                const precoMes = {};
                empresas.forEach(e => {
                    precoMes[e.id] = e.precoCom * Math.pow(1 + crescMensal, mes);
                });

                // Calculate value gained from price appreciation during the month
                let ganhosPrecoBruto = 0;
                empresas.forEach(e => {
                    const precoMesAnterior = e.precoCom * Math.pow(1 + crescMensal, mes - 1);
                    const precoMesAtual = precoMes[e.id];
                    const ganho = (precoMesAtual - precoMesAnterior) * quantidadeAcoes[e.id];
                    ganhosPrecoBruto += ganho;
                });

                // Calculate cost of new shares purchased this month
                let custoNovasAcoes = 0;
                empresas.forEach(e => {
                    const precoMedio = (e.precoCom * Math.pow(1 + crescMensal, mes - 1) + precoMes[e.id]) / 2;
                    const novasAcoes = acoesPerMes * e.quantidade;
                    custoNovasAcoes += precoMedio * novasAcoes;
                    quantidadeAcoes[e.id] += novasAcoes;
                });

                // Calculate dividends (monthly = annual / 12)
                const dividendosMes = empresas.reduce((sum, empresa) => {
                    return sum + ((empresa.dividendoAnual / 12) * quantidadeAcoes[empresa.id]);
                }, 0);

                // Calculate portfolio value at end of month
                const valorCarteiraFinal = empresas.reduce((sum, empresa) => {
                    return sum + (quantidadeAcoes[empresa.id] * precoMes[empresa.id]);
                }, 0);

                resultados.push({
                    ano: mesAtual,
                    saldoInicial: saldoAnterior,
                    aportes: custoNovasAcoes,
                    ganhospreco: ganhosPrecoBruto,
                    dividendos: dividendosMes,
                    saldoFinal: valorCarteiraFinal
                });

                saldoAnterior = valorCarteiraFinal;
            }

            return resultados;
        }

        // Simulation function for specific company
        function simularEmpresa(empresaId, meses, acoesPerMesInput) {
            const empresa = empresas.find(e => e.id === empresaId);
            if (!empresa) return [];

            const acoesPerMes = acoesPerMesInput || 0;
            const crescMensal = Math.pow(1.08, 1/12) - 1;

            let resultados = [];
            let quantidadeAcoes = empresa.quantidade;
            let saldoAnterior = empresa.precoCom * empresa.quantidade;

            for (let mes = 1; mes <= meses; mes++) {
                const mesAtual = mes;

                // Price at start and end of month
                const precoMesAnterior = empresa.precoCom * Math.pow(1 + crescMensal, mes - 1);
                const precoMesAtual = empresa.precoCom * Math.pow(1 + crescMensal, mes);

                // Gains from price appreciation
                const ganhospreco = (precoMesAtual - precoMesAnterior) * quantidadeAcoes;

                // Cost of new shares (average price during month)
                const precoMedio = (precoMesAnterior + precoMesAtual) / 2;
                const custoNovasAcoes = precoMedio * acoesPerMes;
                quantidadeAcoes += acoesPerMes;

                // Dividends (monthly = annual / 12)
                const dividendos = (empresa.dividendoAnual / 12) * quantidadeAcoes;

                // Portfolio value at end of month
                const saldoFinal = quantidadeAcoes * precoMesAtual;

                resultados.push({
                    ano: mesAtual,
                    saldoInicial: saldoAnterior,
                    aportes: custoNovasAcoes,
                    ganhospreco: ganhospreco,
                    dividendos: dividendos,
                    saldoFinal: saldoFinal
                });

                saldoAnterior = saldoFinal;
            }

            return resultados;
        }

        // Calculate metrics
        function calcularMetricas(resultados, empresaId = null) {
            if (resultados.length === 0) return null;

            const ultimoMes = resultados[resultados.length - 1];
            const dividendosTotal = resultados.reduce((sum, mes) => sum + mes.dividendos, 0);
            const ganhosPrecoTotal = resultados.reduce((sum, mes) => sum + mes.ganhospreco, 0);
            const aportesTotal = resultados.reduce((sum, mes) => sum + mes.aportes, 0);

            const investimentoTotal = empresaId
                ? empresas.find(e => e.id === empresaId).precoCom + aportesTotal
                : investimentoInicial + aportesTotal;

            const valorAtual = ultimoMes.saldoFinal;
            const roi = ((valorAtual - investimentoTotal) / investimentoTotal) * 100;

            // Calculate number of stocks held and average price
            const meses = resultados.length;
            const crescMensal = Math.pow(1.08, 1/12) - 1;

            let totalAcoes = 0;
            let precoMedio = 0;

            if (empresaId) {
                const empresa = empresas.find(e => e.id === empresaId);
                const acoesPerMes = parseFloat(document.getElementById('acoesPerMes').value) || 0;
                totalAcoes = empresa.quantidade + (acoesPerMes * meses);
                const precoAtual = empresa.precoCom * Math.pow(1 + crescMensal, meses);
                precoMedio = precoAtual;
            } else {
                const acoesPerMes = parseFloat(document.getElementById('acoesPerMes').value) || 0;
                empresas.forEach(e => {
                    const qtd = e.quantidade + (acoesPerMes * meses);
                    totalAcoes += qtd;
                    const precoAtual = e.precoCom * Math.pow(1 + crescMensal, meses);
                    precoMedio += precoAtual * qtd;
                });
                precoMedio = precoMedio / totalAcoes;
            }

            return {
                investimentoTotal,
                valorAtual,
                dividendosTotal,
                roi,
                totalAcoes,
                precoMedio
            };
        }

            tabsContainer.appendChild(btnCarteira);

            empresas.forEach(empresa => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'sim-tab-btn';
                btn.textContent = empresa.nomeEng || empresa.nome;
                btn.dataset.tab = `empresa-${empresa.id}`;
                btn.addEventListener('click', () => trocarAba(`empresa-${empresa.id}`));
                tabsContainer.appendChild(btn);
            });
        }

        function trocarAba(tabId) {
            document.querySelectorAll('.sim-tab-btn').forEach(btn => {
                btn.classList.remove('sim-tab-active');
            });

            document.querySelector(`[data-tab="${tabId}"]`).classList.add('sim-tab-active');

                "ROI positivo significa que sua estratégia está funcionando!",
                "O segredo é começar, não é esperar o momento perfeito.",
                "Sua carteira está crescendo enquanto você dorme!",
                "Disciplina financeira leva à independência econômica."
            ];

            // Selecionar comentário aleatório
            const comentario = comentarios[Math.floor(Math.random() * comentarios.length)];

            // Ajustar comentário baseado em ROI
            let prefixo = "📈";
            if (metricas.roi < 0) prefixo = "📊";
            else if (metricas.roi > 50) prefixo = "🚀";
            else if (metricas.roi > 20) prefixo = "⭐";

            return `<div class="sim-comentario">${prefixo} ${comentario}</div>`;
        }

        // Render cards
        function renderizarCards(metricas) {
            const comentario = gerarComentarioAleatorio(metricas);
            const cardsHtml = `
                ${comentario}
                <div class="sim-cards">
                    <div class="sim-card">
                        <div class="sim-card-label">Investimento Total</div>
                        <div class="sim-card-value">${formatarMoeda(metricas.investimentoTotal)}</div>
                    </div>
                    <div class="sim-card">
                        <div class="sim-card-label">Valor Atual</div>
                        <div class="sim-card-value">${formatarMoeda(metricas.valorAtual)}</div>
                        <div class="sim-card-detail">${Math.round(metricas.totalAcoes)} acoes a ${formatarMoeda(metricas.precoMedio)}</div>
                    </div>
                    <div class="sim-card">
                        <div class="sim-card-label">Dividendos Acumulados</div>
                        <div class="sim-card-value">${formatarMoeda(metricas.dividendosTotal)}</div>
                    </div>
                    <div class="sim-card">
                        <div class="sim-card-label">ROI %</div>
                        <div class="sim-card-value">${formatarPercentual(metricas.roi)}</div>
                    </div>
                </div>
            `;
            return cardsHtml;
        }

        // Render table
        function renderizarTabela(resultados) {
            let tabelaHtml = `
                <div class="sim-table-container">
                    <table class="sim-table">
                        <thead>
                            <tr>
                                <th>Mes</th>
                                <th>Saldo Inicial</th>
                                <th>Aportes</th>
                                <th>Ganhos Preco</th>
                                <th>Dividendos</th>
                                <th>Saldo Final</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            resultados.forEach(linha => {
                tabelaHtml += `
                    <tr>
                        <td>${linha.ano}</td>
                        <td>${formatarMoeda(linha.saldoInicial)}</td>
                        <td>${formatarMoeda(linha.aportes)}</td>
                        <td>${formatarMoeda(linha.ganhospreco)}</td>
                        <td>${formatarMoeda(linha.dividendos)}</td>
                        <td>${formatarMoeda(linha.saldoFinal)}</td>
                    </tr>
                `;
            });

            tabelaHtml += `
                        </tbody>
                    </table>
                </div>
            `;

            return tabelaHtml;
        }

        // Chart instance
        let chartInstance = null;

        function renderizarGrafico(resultados) {
            if (chartInstance) {
                chartInstance.destroy();
            }

            const ctx = document.getElementById('simChart').getContext('2d');

            const labels = resultados.map(r => r.ano.toString());
            const data = resultados.map(r => r.saldoFinal);

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Valor da Carteira (¥)',
                        data: data,
                        borderColor: '#2dd4a4',
                        backgroundColor: 'rgba(45, 212, 164, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#2dd4a4',
                        pointBorderColor: '#2dd4a4',
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                color: '#e0e0e0'
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#888888' },
                            grid: { color: '#333333' }
                        },
                        y: {
                            ticks: { color: '#888888' },
                            grid: { color: '#333333' }
                        }
                    }
                }
            });
        }

        // Main content renderer
        function renderizarConteudoAba(tabId) {
            const tabContent = document.getElementById('tabContent');
            let resultados, metricas, empresaId;

            if (tabId === 'carteira-total') {
                const meses = parseInt(document.getElementById('meses').value);
                const acoesPerMes = parseFloat(document.getElementById('acoesPerMes').value) || 0;
                resultados = simularCarteira(meses, acoesPerMes);
                metricas = calcularMetricas(resultados);
            } else {
                empresaId = parseInt(tabId.replace('empresa-', ''));
                const meses = parseInt(document.getElementById('meses').value);
                const acoesPerMes = parseFloat(document.getElementById('acoesPerMes').value) || 0;
                resultados = simularEmpresa(empresaId, meses, acoesPerMes);
                metricas = calcularMetricas(resultados, empresaId);
            }

            let conteudo = renderizarCards(metricas);
            conteudo += '<div class="sim-chart-container"><canvas id="simChart"></canvas></div>';
            conteudo += renderizarTabela(resultados);

            tabContent.innerHTML = conteudo;

            setTimeout(() => renderizarGrafico(resultados), 100);
        }

        // Form submission handler
        document.getElementById('simForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const meses = parseInt(document.getElementById('meses').value);
            const acoesPerMes = parseFloat(document.getElementById('acoesPerMes').value) || 0;
            const errorDiv = document.getElementById('formError');

            errorDiv.style.display = 'none';
            errorDiv.textContent = '';

            let erro = null;

            if (isNaN(meses) || meses < 1 || meses > 600) {
                erro = 'Meses deve estar entre 1 e 600';
            } else if (isNaN(acoesPerMes) || acoesPerMes < 0) {
                erro = 'Quantidade de acoes invalida';
            }

            if (erro) {
                errorDiv.textContent = 'Erro: ' + erro;
                errorDiv.style.display = 'block';
                return;
            }

            document.getElementById('simResults').style.display = 'block';
            renderizarAbas();
            renderizarConteudoAba('carteira-total');
            document.getElementById('simResults').scrollIntoView({ behavior: 'smooth' });
        });

        // Exportar para namespace global
        app.init = function() {
            console.log('Simulador de Investimentos carregado');
        };

        // Auto-init ao carregar
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', app.init);
        } else {
            app.init();
        }

        })(window.simuladorInvestimentos);
    </script>
</body>
</html>
