services:
  - type: web
    name: extrator-imoveis
    runtime: python-3.11
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn web.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VISION_MODEL
        value: claude-sonnet-5
